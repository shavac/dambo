[package]
name = "dambo-core"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[features]
default = ["file-watcher"]
file-watcher = ["dep:notify"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std"] }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "query", "tokio", "ws"] }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
http = "1.5.0"
futures-util = { workspace = true }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
blive-proto = "0.2.0"
qrcode = { version = "0.15.0", default-features = false, features = ["std", "svg"] }
notify = { version = "8", optional = true }
redb = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json", "query", "rustls"] }
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite = "0.29.0"
