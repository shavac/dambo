[package]
name = "dambo-core"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
log = { version = "0.4.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
http = "1.5.0"
futures-util = "0.3.34"
toml = "1.1.8"
regex = "1.13.1"
blive-proto = "0.2.0" 
qrcode = { version = "0.15.0", features = ["svg"] }
notify = "8"
redb = "2"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json", "query", "rustls"] }
tokio-tungstenite = "0.29.0"
