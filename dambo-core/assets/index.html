<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dambo · 服务门户与插件索引</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-alt: #162032;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
    }
    #dambo-portal-root {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      align-items: stretch;
    }
    @media (max-width: 820px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .between {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    h1, h2, h3 {
      margin: 0;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }
    .badge.ok { border-color: rgba(34, 197, 94, 0.45); color: #86efac; }
    .badge.warn { border-color: rgba(245, 158, 11, 0.45); color: #fcd34d; }
    .badge.danger { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .badge.accent { border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc; }
    button, .btn-link {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    button:hover, .btn-link:hover {
      border-color: var(--accent);
    }
    button.primary, .btn-link.primary {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:hover, .btn-link.primary:hover {
      background: var(--accent-hover);
    }
    button.small, .btn-link.small {
      padding: 5px 10px;
      font-size: 12px;
    }
    button.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      font-weight: 600;
    }
    button.copied {
      border-color: rgba(34, 197, 94, 0.65);
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(51, 65, 85, 0.7);
      padding: 4px 8px;
      border-radius: 6px;
      word-break: break-all;
    }
    .admin-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(30, 41, 59, 0.96));
      border-color: rgba(56, 189, 248, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }
    .status-cell {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(51, 65, 85, 0.85);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .lan-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .lan-info {
      flex: 1 1 200px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lan-qr-img {
      width: 116px;
      height: 116px;
      border-radius: 8px;
      background: #ffffff;
      padding: 5px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: block;
    }
    .plugins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }
    .plugin-card {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.15s ease;
    }
    .plugin-card:hover {
      border-color: rgba(56, 189, 248, 0.55);
    }
    .plugin-card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .plugin-url-box {
      font-size: 11px;
      color: #bae6fd;
    }
    .plugin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding-top: 2px;
    }
    input[type="search"] {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 13px;
      font-family: inherit;
      min-width: 200px;
    }
    input[type="search"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .hidden { display: none !important; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 900;
      padding: 10px 14px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid var(--accent);
      color: var(--text);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      display: none;
      max-width: 380px;
    }
    .toast.visible { display: block; }
    .toast.error { border-color: var(--danger); color: #fecaca; }
  </style>
</head>
<body>
  <main id="dambo-portal-root">
    <!-- Top Header + LAN Bar -->
    <section class="hero-grid">
      <div class="card admin-card" id="admin-entry-card">
        <div class="between">
          <div>
            <div class="row">
              <h1 class="brand-title">Dambo · 服务门户</h1>
              <span class="badge" id="portal-mode-badge">检测中</span>
            </div>
            <div class="muted" style="margin-top: 4px;">直播弹幕插件平台 · 局域网发现 · OBS 源入口与集中管理</div>
          </div>
          <a class="btn-link primary" id="open-admin-link" href="/admin">进入统一管理后台 (/admin)</a>
        </div>

        <div class="status-grid">
          <div class="status-cell">
            <span class="muted">直播间状态</span>
            <strong id="status-room-text">正在读取…</strong>
            <span class="muted" id="status-room-sub"></span>
          </div>
          <div class="status-cell">
            <span class="muted">录制状态</span>
            <strong id="status-rec-text">正在读取…</strong>
            <span class="muted" id="status-rec-sub"></span>
          </div>
          <div class="status-cell">
            <span class="muted">活跃插件数</span>
            <strong id="status-plugins-count">-</strong>
            <span class="muted">目录 static/html/</span>
          </div>
        </div>
      </div>

      <div class="card lan-card" id="lan-card">
        <div class="lan-info">
          <div class="between">
            <strong style="font-size: 14px;">局域网访问与扫码</strong>
            <button type="button" class="small" id="portal-refresh-btn">刷新</button>
          </div>
          <div class="row hidden" id="lan-ip-tabs"></div>
          <code id="lan-url-code">正在扫描本机私网 IPv4…</code>
          <div class="muted hidden" id="lan-local-note"></div>
          <div class="row">
            <button type="button" class="small primary" id="lan-copy-btn">复制访问地址</button>
            <a class="btn-link small" id="lan-admin-qr-link" href="/admin">打开后台</a>
          </div>
        </div>
        <img class="lan-qr-img hidden" id="lan-qr-img" alt="局域网服务门户二维码" />
      </div>
    </section>

    <!-- Plugins Directory -->
    <section class="card" id="plugins-section">
      <div class="between" style="margin-bottom: 14px;">
        <div>
          <h2 style="font-size: 16px;">插件目录（OBS 浏览器源 &amp; 独立管理页）</h2>
          <div class="muted">在 OBS Studio 中添加「浏览器」源时，请直接使用下方的 <code>/{id}/plugin.html</code> 地址</div>
        </div>
        <div class="row">
          <input type="search" id="plugin-search-input" placeholder="按名称、ID 或描述筛选插件…" />
        </div>
      </div>

      <div class="plugins-grid" id="plugins-grid">
        <div class="muted">正在加载插件列表…</div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      'use strict';

      const portalModeBadgeEl = document.getElementById('portal-mode-badge');
      const openAdminLinkEl = document.getElementById('open-admin-link');
      const lanAdminLinkEl = document.getElementById('lan-admin-qr-link');
      const statusRoomTextEl = document.getElementById('status-room-text');
      const statusRoomSubEl = document.getElementById('status-room-sub');
      const statusRecTextEl = document.getElementById('status-rec-text');
      const statusRecSubEl = document.getElementById('status-rec-sub');
      const statusPluginsCountEl = document.getElementById('status-plugins-count');

      const lanIpTabsEl = document.getElementById('lan-ip-tabs');
      const lanUrlCodeEl = document.getElementById('lan-url-code');
      const lanLocalNoteEl = document.getElementById('lan-local-note');
      const lanCopyBtnEl = document.getElementById('lan-copy-btn');
      const lanQrImgEl = document.getElementById('lan-qr-img');
      const portalRefreshBtnEl = document.getElementById('portal-refresh-btn');

      const pluginSearchEl = document.getElementById('plugin-search-input');
      const pluginsGridEl = document.getElementById('plugins-grid');
      const toastEl = document.getElementById('toast');

      let lanPayload = null;
      let lanSelectedIdx = 0;
      let allPlugins = [];
      let toastTimer = null;

      function showToast(msg, isError) {
        if (toastTimer) clearTimeout(toastTimer);
        toastEl.textContent = String(msg || '');
        toastEl.className = isError ? 'toast visible error' : 'toast visible';
        toastTimer = setTimeout(() => {
          toastEl.className = 'toast';
        }, 3000);
      }

      async function copyText(text, triggerBtn, resetLabel) {
        try {
          await navigator.clipboard.writeText(text);
          showToast('已复制: ' + text);
          if (triggerBtn) {
            const orig = resetLabel || triggerBtn.textContent;
            triggerBtn.classList.add('copied');
            triggerBtn.textContent = '✓ 已复制';
            setTimeout(() => {
              triggerBtn.classList.remove('copied');
              triggerBtn.textContent = orig;
            }, 1500);
          }
        } catch (_) {
          showToast('地址: ' + text);
        }
      }

      function forwardHashSuffix() {
        const rawHash = window.location.hash || '';
        return rawHash.startsWith('#t=') ? rawHash : '';
      }

      function makeBadge(text, cls) {
        const span = document.createElement('span');
        span.className = cls ? ('badge ' + cls) : 'badge';
        span.textContent = text;
        return span;
      }

      function renderStatus(status) {
        if (!status) return;
        const isOpen = status.security_mode === 'open';
        portalModeBadgeEl.textContent = isOpen ? 'Open 模式 (局域网便利)' : 'Strict 模式 (零信任)';
        portalModeBadgeEl.className = isOpen ? 'badge warn' : 'badge accent';

        const rs = status.room_state || {};
        if (rs.connected && rs.room_id > 0) {
          statusRoomTextEl.textContent = rs.is_live ? ('● 直播中 · ' + rs.room_id) : ('○ 未开播 · ' + rs.room_id);
          const ownerPart = rs.room_uname ? (rs.room_uname + ' ') : '';
          statusRoomSubEl.textContent = (ownerPart + (rs.room_title || '')).trim() || '已连接直播间';
        } else {
          statusRoomTextEl.textContent = '未连接直播间';
          statusRoomSubEl.textContent = '可在控制舱、CLI 或 /admin 概览查看';
        }

        const rec = status.recording || {};
        if (!rec.enabled) {
          statusRecTextEl.textContent = '录制未启用';
          statusRecSubEl.textContent = 'config [record].enabled = false';
        } else if (rec.active) {
          statusRecTextEl.textContent = rec.record_raw ? '● 录制中 (+raw)' : '● 录制中';
          statusRecSubEl.textContent = rec.current_file || '正在写入 JSONL';
        } else {
          statusRecTextEl.textContent = rec.record_raw ? '待机 (+raw)' : '待机';
          statusRecSubEl.textContent = '进入直播间后自动录制';
        }

        statusPluginsCountEl.textContent = String(
          typeof status.plugin_count === 'number' ? status.plugin_count : allPlugins.length
        );
      }

      function renderLanCard() {
        if (!lanPayload) return;
        const urls = Array.isArray(lanPayload.urls) ? lanPayload.urls : [];
        if (lanPayload.local_only || urls.length === 0) {
          lanIpTabsEl.replaceChildren();
          lanIpTabsEl.classList.add('hidden');
          lanUrlCodeEl.textContent = lanPayload.local_url || window.location.href;
          lanLocalNoteEl.textContent = '仅限本机访问（当前监听回环地址或未检测到私网 IPv4）';
          lanLocalNoteEl.classList.remove('hidden');
          lanQrImgEl.classList.add('hidden');
          return;
        }

        if (lanSelectedIdx >= urls.length) lanSelectedIdx = 0;
        const entry = urls[lanSelectedIdx];
        lanLocalNoteEl.classList.add('hidden');
        lanUrlCodeEl.textContent = entry.url;
        if (entry.qr_svg) {
          lanQrImgEl.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(entry.qr_svg);
          lanQrImgEl.classList.remove('hidden');
        } else {
          lanQrImgEl.classList.add('hidden');
        }

        lanIpTabsEl.replaceChildren();
        if (urls.length > 1) {
          lanIpTabsEl.classList.remove('hidden');
          urls.forEach((item, idx) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = idx === lanSelectedIdx ? 'small active' : 'small';
            btn.textContent = item.ip;
            btn.addEventListener('click', () => {
              lanSelectedIdx = idx;
              renderLanCard();
            });
            lanIpTabsEl.appendChild(btn);
          });
        } else {
          lanIpTabsEl.classList.add('hidden');
        }
      }

      function renderPluginsGrid() {
        const kw = (pluginSearchEl.value || '').trim().toLowerCase();
        const filtered = allPlugins.filter((p) => {
          if (!kw) return true;
          return (
            String(p.plugin_name || '').toLowerCase().includes(kw) ||
            String(p.plugin_id || '').toLowerCase().includes(kw) ||
            String(p.name || '').toLowerCase().includes(kw) ||
            String(p.description || '').toLowerCase().includes(kw)
          );
        });

        pluginsGridEl.replaceChildren();
        if (filtered.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'muted';
          empty.textContent = allPlugins.length === 0
            ? '插件目录 static/html/ 下暂未发现有效插件（需包含 plugin.html）'
            : '没有匹配当前筛选条件的插件';
          pluginsGridEl.appendChild(empty);
          return;
        }

        const hashSuffix = forwardHashSuffix();

        for (const p of filtered) {
          const card = document.createElement('article');
          card.className = 'plugin-card';

          const head = document.createElement('div');
          const titleRow = document.createElement('div');
          titleRow.className = 'between';
          const titleEl = document.createElement('h3');
          titleEl.className = 'plugin-card-title';
          titleEl.textContent = p.name || p.plugin_name;
          titleRow.appendChild(titleEl);

          const badges = document.createElement('div');
          badges.className = 'row';
          badges.appendChild(makeBadge(p.is_builtin ? '内置' : '扩展', p.is_builtin ? 'accent' : 'ok'));
          badges.appendChild(makeBadge('v' + p.version));
          if (p.obs && (p.obs.width || p.obs.height)) {
            badges.appendChild(makeBadge(`${p.obs.width || '?'}×${p.obs.height || '?'}`));
          }
          titleRow.appendChild(badges);
          head.appendChild(titleRow);

          const idMeta = document.createElement('div');
          idMeta.className = 'muted';
          idMeta.style.marginTop = '4px';
          idMeta.textContent = `目录: ${p.plugin_name} · 域: ${p.namedomain}`;
          head.appendChild(idMeta);

          const desc = document.createElement('div');
          desc.className = 'muted';
          desc.style.marginTop = '6px';
          desc.textContent = p.description || '无描述信息（可在 plugin.json 中设置 description）';
          head.appendChild(desc);

          const obsPath = '/' + encodeURIComponent(p.plugin_name) + '/plugin.html';
          const obsUrl = new URL(obsPath, window.location.origin).toString();
          const urlCode = document.createElement('code');
          urlCode.className = 'plugin-url-box';
          urlCode.style.display = 'block';
          urlCode.style.marginTop = '8px';
          urlCode.textContent = obsUrl;
          head.appendChild(urlCode);

          const actions = document.createElement('div');
          actions.className = 'plugin-actions';

          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'small primary';
          copyBtn.textContent = '复制 OBS 源 URL';
          copyBtn.addEventListener('click', () => copyText(obsUrl, copyBtn, '复制 OBS 源 URL'));

          const previewLink = document.createElement('a');
          previewLink.className = 'btn-link small';
          previewLink.href = obsPath;
          previewLink.target = '_blank';
          previewLink.rel = 'noopener';
          previewLink.textContent = '浏览器预览';

          const manageLink = document.createElement('a');
          manageLink.className = 'btn-link small';
          manageLink.href = (p.manage_route || ('/' + encodeURIComponent(p.plugin_name) + '/m')) + hashSuffix;
          manageLink.target = '_blank';
          manageLink.rel = 'noopener';
          manageLink.textContent = '打开管理页';

          actions.appendChild(copyBtn);
          actions.appendChild(previewLink);
          actions.appendChild(manageLink);

          card.appendChild(head);
          card.appendChild(actions);
          pluginsGridEl.appendChild(card);
        }
      }

      async function loadPortalData() {
        const hashSuffix = forwardHashSuffix();
        openAdminLinkEl.href = '/admin' + hashSuffix;
        lanAdminLinkEl.href = '/admin' + hashSuffix;

        try {
          const [statusRes, lanRes, pluginsRes] = await Promise.all([
            fetch('/api/v1/system/status', { credentials: 'same-origin' }),
            fetch('/api/v1/system/lan-urls?path=%2F', { credentials: 'same-origin' }),
            fetch('/api/v1/plugins', { credentials: 'same-origin' }),
          ]);

          if (statusRes.ok) {
            renderStatus(await statusRes.json());
          }
          if (lanRes.ok) {
            lanPayload = await lanRes.json();
            renderLanCard();
          }
          if (pluginsRes.ok) {
            const pJson = await pluginsRes.json();
            allPlugins = Array.isArray(pJson.plugins) ? pJson.plugins : [];
            renderPluginsGrid();
            statusPluginsCountEl.textContent = String(allPlugins.length);
          }
        } catch (err) {
          showToast('加载门户信息失败: ' + (err && err.message ? err.message : String(err)), true);
        }
      }

      lanCopyBtnEl.addEventListener('click', () => {
        const text = lanUrlCodeEl.textContent ? lanUrlCodeEl.textContent.trim() : '';
        if (text) copyText(text, lanCopyBtnEl, '复制访问地址');
      });
      portalRefreshBtnEl.addEventListener('click', loadPortalData);
      pluginSearchEl.addEventListener('input', renderPluginsGrid);

      loadPortalData();
    })();
  </script>
</body>
</html>
