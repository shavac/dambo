[workspace]
members = [
    "dambo-core",
    "cli",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.5.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shavac/dambo"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = "1.54.1"
tokio-util = "0.7.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
