[package]
name = "dambo-cli"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[[bin]]
name = "dambo-cli"
path = "src/main.rs"

[dependencies]
dambo-core = { path = "../dambo-core" }
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.35"
env_logger = "0.11.11"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3.34"
chrono = "0.4.45"
unicode-width = "0.2"
