<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <base href="/list/">
    <title>Dambo Danmaku Monitor</title>
    <link rel="stylesheet" href="./plugin.css">
</head>
<body>
    <div class="list-layout">
        <!-- Top Sticky Area for SuperChat & Guard -->
        <header id="sticky-header" class="sticky-header hidden">
            <div class="sticky-title">⭐ SuperChat &amp; Guard</div>
            <div id="sticky-cards" class="sticky-cards"></div>
        </header>

        <!-- Controls & Filters Bar -->
        <nav class="filter-bar">
            <div class="filter-tags">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="chat">Chat</button>
                <button class="filter-btn" data-filter="gift_sc">Gifts &amp; SC</button>
                <button class="filter-btn" data-filter="medal">Medals</button>
            </div>
            <div id="room-status-badge" class="room-status-badge">Disconnected</div>
        </nav>

        <!-- Main Feed Scroll Container -->
        <main id="feed-container" class="feed-container">
            <div id="feed-list" class="feed-list"></div>
        </main>

        <!-- Smart Scroll Lock Floating Button -->
        <button id="scroll-bottom-btn" class="scroll-bottom-btn hidden">
            ↓ <span id="new-msg-count">0</span> new messages
        </button>
    </div>

    <script src="/sdk/dambo.js"></script>
    <script src="./plugin.js"></script>
</body>
</html>
