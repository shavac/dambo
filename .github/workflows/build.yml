name: Build and Package

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: dambo-macos-arm64
          - os: windows-latest
            artifact_name: dambo-windows-x64

    steps:
      - name: Exclude workspace from Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cargo version matches Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              sub(/^[^"]*"/, "")
              sub(/".*$/, "")
              gsub(/\r/, "")
              print
              exit
            }
          ' Cargo.toml)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml [workspace.package].version : ${CARGO_VERSION}"
          echo "Git tag (${GITHUB_REF_NAME}) version   : ${TAG_VERSION}"
          if [[ -z "$CARGO_VERSION" || "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Version mismatch: Cargo.toml declares '${CARGO_VERSION}', but Git tag '${GITHUB_REF_NAME}' expects '${TAG_VERSION}'." >&2
            exit 1
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup NASM on Windows
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Ensure CMake on macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Run workspace tests (release)
        run: cargo test --release --workspace

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: cargo build --release --workspace

      - name: Stage macOS release directory
        if: matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh --skip-build

          STAGE_DIR="dist/${{ matrix.artifact_name }}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          ditto Dambo.app "$STAGE_DIR/Dambo.app"
          cp target/release/dambo "$STAGE_DIR/dambo"
          chmod +x "$STAGE_DIR/dambo"
          mkdir -p "$STAGE_DIR/etc" "$STAGE_DIR/docs/sdk"
          cp etc/config.toml "$STAGE_DIR/etc/config.toml"
          cp README.md README.md.zh "$STAGE_DIR/"
          cp -R static "$STAGE_DIR/static"
          cp docs/PLUGIN_SDK.md "$STAGE_DIR/docs/PLUGIN_SDK.md"
          cp docs/sdk/dambo.js "$STAGE_DIR/docs/sdk/dambo.js"

      - name: Stage Windows release directory
        if: matrix.os == 'windows-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $StageDir = "dist\${{ matrix.artifact_name }}"
          if (Test-Path $StageDir) { Remove-Item -Recurse -Force $StageDir }
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null

          Copy-Item "target\release\dambo-ui.exe" -Destination "$StageDir\dambo-ui.exe"
          Copy-Item "target\release\dambo.exe" -Destination "$StageDir\dambo.exe"
          New-Item -ItemType Directory -Force -Path "$StageDir\etc", "$StageDir\docs\sdk" | Out-Null
          Copy-Item "etc\config.toml" -Destination "$StageDir\etc\config.toml"
          Copy-Item "static" -Destination "$StageDir\static" -Recurse
          Copy-Item "README.md" -Destination "$StageDir\README.md"
          Copy-Item "README.md.zh" -Destination "$StageDir\README.md.zh"
          Copy-Item "docs\PLUGIN_SDK.md" -Destination "$StageDir\docs\PLUGIN_SDK.md"
          Copy-Item "docs\sdk\dambo.js" -Destination "$StageDir\docs\sdk\dambo.js"

      - name: Upload staged release directory
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging

      - name: Package versioned release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd release-staging

          chmod +x dambo-macos-arm64/dambo dambo-macos-arm64/Dambo.app/Contents/MacOS/*

          for dir in dambo-*; do
            [ -d "$dir" ] || continue
            platform="${dir#dambo-}"
            archive="../release-assets/dambo-${GITHUB_REF_NAME}-${platform}.zip"
            zip -ry "$archive" "$dir"
          done

          ls -lh ../release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dambo ${{ github.ref_name }}"
          files: release-assets/*.zip
          generate_release_notes: true
