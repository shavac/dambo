name: Build and Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Frontend Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            cmake \
            build-essential

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy on core & CLI (-D warnings)
        run: cargo clippy -p dambo-core -p dambo-cli --all-targets -- -D warnings

      - name: Run Clippy on desktop UI crate
        run: cargo clippy -p dambo-ui --all-targets

      - name: Check JavaScript syntax & frontend hygiene
        shell: bash
        run: |
          set -euo pipefail
          for f in dambo-core/assets/dambo.js static/html/*/*.js ui/*.js; do
            node --check "$f"
          done
          python3 - <<'PY'
          import glob
          import json

          json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))
          for p in glob.glob("src-tauri/capabilities/*.json") + glob.glob("static/html/*/plugin.json"):
              json.load(open(p, encoding="utf-8"))

          locales = {
              name: json.load(open(f"src-tauri/locales/{name}.json", encoding="utf-8"))
              for name in ("zh-CN", "ja", "en")
          }
          assert set(locales["zh-CN"]) == set(locales["ja"]) == set(locales["en"]), "Locale key mismatch"
          assert all(isinstance(v, str) and v.strip() for d in locales.values() for v in d.values()), "Empty translation value"

          for path in glob.glob("ui/*.html") + glob.glob("ui/*.js") + glob.glob("static/html/*/*.js"):
              text = open(path, encoding="utf-8").read()
              assert "innerHTML" not in text, f"Unexpected innerHTML in {path}"
          print("Frontend JSON, i18n, and DOM hygiene checks passed.")
          PY

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: dambo-macos-arm64
          - os: windows-latest
            artifact_name: dambo-windows-x64
          - os: ubuntu-22.04
            artifact_name: dambo-linux-x64

    steps:
      - name: Exclude workspace from Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cargo version matches Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              sub(/^[^"]*"/, "")
              sub(/".*$/, "")
              gsub(/\r/, "")
              print
              exit
            }
          ' Cargo.toml)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml [workspace.package].version : ${CARGO_VERSION}"
          echo "Git tag (${GITHUB_REF_NAME}) version   : ${TAG_VERSION}"
          if [[ -z "$CARGO_VERSION" || "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Version mismatch: Cargo.toml declares '${CARGO_VERSION}', but Git tag '${GITHUB_REF_NAME}' expects '${TAG_VERSION}'." >&2
            exit 1
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup NASM on Windows
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Ensure CMake on macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            cmake \
            build-essential

      - name: Run workspace tests (debug)
        if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch'"
        run: cargo test --workspace

      - name: Run workspace tests (release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: cargo test --release --workspace

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: cargo build --release --workspace

      - name: Stage macOS release directory
        if: matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh --skip-build

          STAGE_DIR="dist/${{ matrix.artifact_name }}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          ditto Dambo.app "$STAGE_DIR/Dambo.app"
          cp target/release/dambo-cli "$STAGE_DIR/dambo-cli"
          chmod +x "$STAGE_DIR/dambo-cli"
          mkdir -p "$STAGE_DIR/etc"
          cp etc/config.sample.toml "$STAGE_DIR/etc/config.toml"
          cp README.md README.en.md PLUGIN_GUIDE.md PLUGIN_GUIDE.zh.md "$STAGE_DIR/"
          cp -R static "$STAGE_DIR/static"

      - name: Stage Windows release directory
        if: matrix.os == 'windows-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $StageDir = "dist\${{ matrix.artifact_name }}"
          if (Test-Path $StageDir) { Remove-Item -Recurse -Force $StageDir }
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null

          Copy-Item "target\release\dambo-ui.exe" -Destination "$StageDir\dambo-ui.exe"
          Copy-Item "target\release\dambo-cli.exe" -Destination "$StageDir\dambo-cli.exe"
          New-Item -ItemType Directory -Force -Path "$StageDir\etc" | Out-Null
          Copy-Item "etc\config.sample.toml" -Destination "$StageDir\etc\config.toml"
          Copy-Item "static" -Destination "$StageDir\static" -Recurse
          Copy-Item "README.md" -Destination "$StageDir\README.md"
          Copy-Item "README.en.md" -Destination "$StageDir\README.en.md"
          Copy-Item "PLUGIN_GUIDE.md" -Destination "$StageDir\PLUGIN_GUIDE.md"
          Copy-Item "PLUGIN_GUIDE.zh.md" -Destination "$StageDir\PLUGIN_GUIDE.zh.md"

      - name: Stage Linux release directory
        if: startsWith(matrix.os, 'ubuntu-') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="dist/${{ matrix.artifact_name }}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/etc"

          cp target/release/dambo-ui "$STAGE_DIR/dambo-ui"
          cp target/release/dambo-cli "$STAGE_DIR/dambo-cli"
          chmod +x "$STAGE_DIR/dambo-ui" "$STAGE_DIR/dambo-cli"
          cp etc/config.sample.toml "$STAGE_DIR/etc/config.toml"
          cp README.md README.en.md PLUGIN_GUIDE.md PLUGIN_GUIDE.zh.md "$STAGE_DIR/"
          cp -R static "$STAGE_DIR/static"

      - name: Upload staged release directory
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging

      - name: Package versioned release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd release-staging

          if [ -d dambo-macos-arm64 ]; then
            chmod +x dambo-macos-arm64/dambo-cli dambo-macos-arm64/Dambo.app/Contents/MacOS/*
          fi
          if [ -d dambo-linux-x64 ]; then
            chmod +x dambo-linux-x64/dambo-ui dambo-linux-x64/dambo-cli
          fi

          for dir in dambo-*; do
            [ -d "$dir" ] || continue
            platform="${dir#dambo-}"
            if [[ "$platform" == linux-* ]]; then
              archive="../release-assets/dambo-${GITHUB_REF_NAME}-${platform}.tar.gz"
              tar -czf "$archive" "$dir"
            else
              archive="../release-assets/dambo-${GITHUB_REF_NAME}-${platform}.zip"
              zip -ry "$archive" "$dir"
            fi
          done

          ls -lh ../release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dambo ${{ github.ref_name }}"
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
          generate_release_notes: true
