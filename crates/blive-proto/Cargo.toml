[package]
name = "blive-proto"
version = "0.1.5"
edition = "2024"
description = "Bilibili live room danmaku protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shavac/dambo"
publish = false

[lib]
name = "blive_proto"
path = "src/lib.rs"

[dependencies]
base64 = "0.21"
brotlic = "0.8.1"
futures-channel = "0.3.28"
http = "0.2.11"
log = "0.4"
md5 = "0.7"
native-tls = "0.2.0"
prost = "0.13"
reqwest = { version = "0.11.17", default-features = false, features = [
    "blocking",
    "cookies",
    "rustls-tls",
    "json",
    "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.20.1"
url = "2.3.1"
