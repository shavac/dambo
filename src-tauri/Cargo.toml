[package]
name = "dambo-ui"
version = "0.99.0"
description = "dambo ui"
authors = ["kshava"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "dambo_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dambo-core = { path = "../dambo-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = { version = "0.4", features = ["serde"] }
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSRunningApplication"] }
tauri-nspanel = "2.1.1"
