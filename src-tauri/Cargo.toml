[package]
name = "dambo-ui"
version.workspace = true
license.workspace = true
repository.workspace = true
description = "dambo ui"
authors = ["kshava"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "dambo_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dambo-core = { path = "../dambo-core" }
serde_json = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
