<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Dambo Capsule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pod-container">
        <!-- Far-left drag grip rail -->
        <div id="drag-handle" class="drag-handle" data-i18n-title="panel.drag_title" title="Drag panel">
            <svg class="grip-svg" width="8" height="18" viewBox="0 0 8 18" fill="currentColor" aria-hidden="true">
                <circle cx="2" cy="3" r="1.15" />
                <circle cx="6" cy="3" r="1.15" />
                <circle cx="2" cy="9" r="1.15" />
                <circle cx="6" cy="9" r="1.15" />
                <circle cx="2" cy="15" r="1.15" />
                <circle cx="6" cy="15" r="1.15" />
            </svg>
        </div>

        <div class="pod-content">
            <!-- Account badge (click to switch / re-login) -->
            <button id="account-badge" class="badge-btn" data-i18n-title="panel.sign_in_title" title="Click to sign in with QR code">
                <span id="account-dot" class="status-dot dot-gray"></span>
                <span id="account-name">Sign In</span>
            </button>

            <span class="divider"></span>

            <!-- Room selection & switch -->
            <div class="room-selector-group" data-tauri-drag-region="false" style="-webkit-app-region: no-drag;">
                <div class="room-picker">
                    <div id="room-input-box" class="room-pill">
                        <span id="room-dot" class="status-dot dot-off"></span>
                        <input id="room-input" type="text" data-i18n-placeholder="panel.room_placeholder" placeholder="Room ID or URL..." spellcheck="false" autocomplete="off" />
                        <button id="room-dropdown-btn" class="icon-btn" data-i18n-title="panel.room_dropdown_title" title="Show room list">▾</button>
                    </div>

                    <!-- Quick dropdown panel (hidden by default) -->
                    <div id="room-dropdown-menu" class="dropdown-menu hidden">
                        <div class="dropdown-section">
                            <div class="section-title" data-i18n="panel.my_room">🏠 My Room</div>
                            <div id="my-room-item" class="menu-item empty-hint" data-i18n="panel.my_room_empty">No room found</div>
                        </div>
                        <div class="dropdown-section">
                            <div class="section-title" data-i18n="panel.following_live">🔴 Following Live</div>
                            <div id="following-rooms-list" class="menu-items-list">
                                <div class="menu-item empty-hint" data-i18n="panel.following_empty">No live channels</div>
                            </div>
                        </div>
                        <div class="dropdown-section">
                            <div class="section-title" data-i18n="panel.recent_rooms">🕒 Recent Rooms</div>
                            <div id="history-rooms-list" class="menu-items-list">
                                <div class="menu-item empty-hint" data-i18n="panel.history_empty">No history</div>
                            </div>
                        </div>
                    </div>
                </div>
                <button id="room-switch-btn" class="action-btn" data-i18n="panel.connect">Connect</button>
            </div>

            <span class="divider"></span>

            <!-- Plugin manager dropdown -->
            <div class="plugin-menu-group">
                <button id="plugin-dropdown-btn" class="pill-btn" data-i18n-title="plugin.trigger_title" title="Manage plugins & desktop overlays" aria-haspopup="true" aria-expanded="false">
                    <span id="plugin-trigger-label">Plugins (0)</span> ▾
                </button>

                <div id="plugin-dropdown-menu" class="plugin-dropdown-menu hidden">
                    <div id="plugin-cards-list" class="plugin-cards-list"></div>
                    <div class="plugin-dropdown-footer">
                        <button id="plugin-open-dir-btn" class="plugin-dir-btn">
                            📂 <span data-i18n="plugin.open_dir">Open Plugins Folder</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- More actions menu button & popover -->
            <div class="more-menu-group">
                <button id="more-btn" class="more-btn" data-i18n-title="more.title" title="More actions" aria-haspopup="menu" aria-expanded="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="5" cy="12" r="2" />
                        <circle cx="12" cy="12" r="2" />
                        <circle cx="19" cy="12" r="2" />
                    </svg>
                </button>

                <div id="more-dropdown-menu" class="more-dropdown-menu hidden" role="menu">
                    <button id="more-pin-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.always_on_top">📌 Always on Top</span>
                        <span id="more-pin-check" class="menu-check"></span>
                    </button>
                    <button id="more-record-raw-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.record_raw">📦 Record Raw Packets (*_raw.jsonl)</span>
                        <span id="more-record-raw-check" class="menu-check"></span>
                    </button>
                    <div class="menu-separator"></div>
                    <button id="more-open-config-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.open_config">📄 Open Config File</span>
                    </button>
                    <button id="more-open-rec-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.open_records">📼 Open Recordings Folder</span>
                    </button>
                    <button id="more-open-log-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.open_logs">📝 Open Logs Folder</span>
                    </button>
                    <div class="menu-separator"></div>
                    <button id="more-relogin-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.relogin">🔄 Re-login</span>
                    </button>
                    <button id="more-logout-btn" class="more-menu-item danger" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.logout">🚪 Sign Out</span>
                    </button>
                </div>
            </div>

            <!-- Window controls (minimize / quit) -->
            <div class="win-controls">
                <button id="min-btn" class="win-btn" data-i18n-title="more.minimize_title" title="Minimize to tray">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12" /></svg>
                </button>
                <button id="close-btn" class="win-btn win-close" data-i18n-title="more.quit_title" title="Quit Dambo">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" /></svg>
                </button>
            </div>
        </div>

        <!-- Far-right physical horizontal resize handle -->
        <div id="resize-handle-right" class="resize-handle-right" aria-hidden="true">
            <span class="resize-indicator"></span>
        </div>
    </main>

    <div id="toast-banner" class="toast-banner hidden" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
