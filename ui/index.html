<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Dambo Capsule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pod-container">
        <!-- Far-left drag grip rail -->
        <div id="drag-handle" class="drag-handle" data-i18n-title="panel.drag_title" title="Drag panel">
            <svg class="grip-svg" width="8" height="18" viewBox="0 0 8 18" fill="currentColor" aria-hidden="true">
                <circle cx="2" cy="3" r="1.15" />
                <circle cx="6" cy="3" r="1.15" />
                <circle cx="2" cy="9" r="1.15" />
                <circle cx="6" cy="9" r="1.15" />
                <circle cx="2" cy="15" r="1.15" />
                <circle cx="6" cy="15" r="1.15" />
            </svg>
        </div>

        <div class="pod-content">
            <!-- Account badge (click to switch / re-login) -->
            <button id="account-badge" class="badge-btn" data-i18n-title="panel.sign_in_title" title="Click to sign in with QR code">
                <span id="account-dot" class="status-dot dot-gray"></span>
                <span id="account-name">Sign In</span>
            </button>

            <span class="divider"></span>

            <!-- Room selection & switch -->
            <div class="room-selector-group" data-tauri-drag-region="false" style="-webkit-app-region: no-drag;">
                <div class="room-picker">
                    <div id="room-input-box" class="room-pill">
                        <span id="room-dot" class="status-dot dot-off"></span>
                        <input id="room-input" type="text" data-i18n-placeholder="panel.room_placeholder" placeholder="Room ID or URL..." spellcheck="false" autocomplete="off" />
                        <button id="room-dropdown-btn" class="icon-btn" data-i18n-title="panel.room_dropdown_title" title="Show room list">▾</button>
                    </div>

                    <!-- Quick dropdown panel (hidden by default) -->
                    <div id="room-dropdown-menu" class="dropdown-menu hidden">
                        <div class="dropdown-section">
                            <div class="section-title" data-i18n="panel.my_room">🏠 My Room</div>
                            <div id="my-room-item" class="menu-item empty-hint" data-i18n="panel.my_room_empty">No room found</div>
                        </div>
                        <div class="dropdown-section">
                            <div class="section-title" data-i18n="panel.following_live">🔴 Following Live</div>
                            <div id="following-rooms-list" class="menu-items-list">
                                <div class="menu-item empty-hint" data-i18n="panel.following_empty">No live channels</div>
                            </div>
                        </div>
                        <div class="dropdown-section">
                            <div class="section-title" data-i18n="panel.recent_rooms">🕒 Recent Rooms</div>
                            <div id="history-rooms-list" class="menu-items-list">
                                <div class="menu-item empty-hint" data-i18n="panel.history_empty">No history</div>
                            </div>
                        </div>
                    </div>
                </div>
                <button id="room-switch-btn" class="action-btn" data-i18n="panel.connect">Enter</button>
            </div>

            <button id="danmaku-toggle-btn" class="more-btn danmaku-toggle-btn" type="button" disabled aria-expanded="false" aria-controls="danmaku-bar" title="Send danmaku">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </button>

            <span class="divider"></span>

            <!-- Plugin manager & Mobile QR dropdown -->
            <div class="plugin-menu-group">
                <button id="plugin-dropdown-btn" class="pill-btn" data-i18n-title="plugin.trigger_title" title="Manage plugins & desktop overlays" aria-haspopup="true" aria-expanded="false">
                    <span id="plugin-trigger-label">Plugins (0)</span> ▾
                </button>

                <div id="plugin-dropdown-menu" class="plugin-dropdown-menu hidden">
                    <div class="plugin-tabs-header">
                        <button type="button" id="tab-plugins-btn" class="plugin-tab-btn active" data-i18n="plugin.tab_plugins">Plugins</button>
                        <button type="button" id="tab-mobile-qr-btn" class="plugin-tab-btn" data-i18n="plugin.tab_mobile_qr">📱 Mobile QR</button>
                    </div>
                    <div id="plugin-cards-list" class="plugin-cards-list"></div>
                    <div id="plugin-qr-panel" class="plugin-qr-panel hidden">
                        <div class="lan-menu-header">
                            <span class="lan-menu-title" data-i18n="console.lan_section">Mobile / LAN QR Code</span>
                            <span id="plugin-qr-mode-badge" class="lan-mode-badge">Open</span>
                        </div>
                        <div id="plugin-qr-targets" class="qr-targets-row"></div>
                        <div id="plugin-qr-page-row" class="qr-page-row hidden">
                            <button type="button" id="qr-mode-view-btn" class="plugin-btn qr-page-btn active" data-qr-page="view" data-i18n="plugin.qr_mode_view">Plugin View</button>
                            <button type="button" id="qr-mode-manage-btn" class="plugin-btn qr-page-btn" data-qr-page="manage" data-i18n="plugin.qr_mode_manage">Plugin Manage</button>
                        </div>
                        <div id="plugin-qr-ip-tabs" class="lan-ip-tabs hidden"></div>
                        <div class="lan-body">
                            <div class="lan-url-col">
                                <div id="plugin-qr-target-path" class="qr-target-path"></div>
                                <div id="plugin-qr-url-text" class="lan-url-text"></div>
                                <div id="plugin-qr-local-note" class="lan-local-note hidden"></div>
                                <div class="lan-actions">
                                    <button type="button" id="plugin-qr-copy-btn" class="plugin-btn primary" data-i18n="lan.copy_url">Copy URL</button>
                                </div>
                            </div>
                            <img id="plugin-qr-img" class="lan-qr-img hidden" alt="QR" />
                        </div>
                    </div>
                    <div class="plugin-dropdown-footer" id="plugin-dropdown-footer">
                        <button id="plugin-open-dir-btn" class="plugin-dir-btn">
                            📂 <span data-i18n="plugin.open_dir">Open Plugins Folder</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Web Control Panel direct trigger -->
            <button id="console-open-btn" class="pill-btn console-trigger-btn" type="button" data-i18n-title="console.trigger_title" title="Open Control Panel in browser">
                <span id="console-trigger-label" data-i18n="console.trigger_label">Console</span>
                <span id="console-pending-badge" class="console-pending-badge hidden">0</span>
            </button>

            <!-- More actions menu button & popover -->
            <div class="more-menu-group">
                <button id="more-btn" class="more-btn" data-i18n-title="more.title" title="More actions" aria-haspopup="menu" aria-expanded="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="5" cy="12" r="2" />
                        <circle cx="12" cy="12" r="2" />
                        <circle cx="19" cy="12" r="2" />
                    </svg>
                </button>

                <div id="more-dropdown-menu" class="more-dropdown-menu hidden" role="menu">
                    <button id="more-record-raw-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.record_raw">📦 Record Raw Packets (*_raw.jsonl)</span>
                        <span id="more-record-raw-check" class="menu-check"></span>
                    </button>
                    <div class="menu-separator"></div>
                    <button id="more-open-config-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.open_config">📄 Open Config File</span>
                    </button>
                    <button id="more-open-rec-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.open_records">📼 Open Recordings Folder</span>
                    </button>
                    <button id="more-open-log-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label" data-i18n="more.open_logs">📝 Open Logs Folder</span>
                    </button>
                    <div class="menu-separator"></div>
                    <div id="more-lang-submenu-group" class="more-submenu-group">
                        <button id="more-lang-trigger" class="more-menu-item more-submenu-trigger" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false">
                            <span class="menu-item-label" data-i18n="more.language">🌐 Language</span>
                            <span class="more-submenu-meta">
                                <span id="more-lang-current" class="more-submenu-current">English</span>
                                <span class="more-submenu-arrow" aria-hidden="true">◂</span>
                            </span>
                        </button>
                        <div id="more-lang-submenu" class="more-submenu hidden" role="menu" aria-label="Language">
                            <button type="button" class="more-menu-item more-lang-option" role="menuitemradio" aria-checked="false" data-locale="zh-CN">
                                <span class="menu-item-label">简体中文</span>
                                <span class="menu-check"></span>
                            </button>
                            <button type="button" class="more-menu-item more-lang-option" role="menuitemradio" aria-checked="false" data-locale="ja">
                                <span class="menu-item-label">日本語</span>
                                <span class="menu-check"></span>
                            </button>
                            <button type="button" class="more-menu-item more-lang-option" role="menuitemradio" aria-checked="false" data-locale="en">
                                <span class="menu-item-label">English</span>
                                <span class="menu-check"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Window controls (pin / minimize / quit) -->
            <div class="win-controls">
                <button id="pin-btn" class="win-btn win-pin" type="button" aria-pressed="false" data-i18n-title="panel.pin_title" title="Pin on top">
                    <svg class="pin-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 17v5" />
                        <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
                    </svg>
                </button>
                <button id="min-btn" class="win-btn" data-i18n-title="more.minimize_title" title="Minimize to tray">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12" /></svg>
                </button>
                <button id="close-btn" class="win-btn win-close" data-i18n-title="more.quit_title" title="Quit Dambo">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" /></svg>
                </button>
            </div>
        </div>

        <!-- Far-right physical horizontal resize handle -->
        <div id="resize-handle-right" class="resize-handle-right" aria-hidden="true">
            <span class="resize-indicator"></span>
        </div>
    </main>

    <section id="danmaku-bar" class="danmaku-bar hidden" aria-label="Send danmaku">
        <input id="danmaku-input" class="danmaku-input" type="text" maxlength="40" data-i18n-placeholder="danmaku.placeholder" placeholder="Send a danmaku (Enter to send, max 40 chars)..." spellcheck="false" autocomplete="off" />
        <button id="danmaku-send-btn" class="danmaku-send-btn" type="button" disabled data-i18n="danmaku.send">Send</button>
    </section>

    <div id="toast-banner" class="toast-banner hidden" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
