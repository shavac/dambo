<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Dambo Capsule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pod-container" data-tauri-drag-region="deep">
        <!-- Far-left drag grip rail -->
        <div id="drag-handle" class="drag-handle" title="Drag panel">
            <svg class="grip-svg" width="8" height="18" viewBox="0 0 8 18" fill="currentColor" aria-hidden="true">
                <circle cx="2" cy="3" r="1.15" />
                <circle cx="6" cy="3" r="1.15" />
                <circle cx="2" cy="9" r="1.15" />
                <circle cx="6" cy="9" r="1.15" />
                <circle cx="2" cy="15" r="1.15" />
                <circle cx="6" cy="15" r="1.15" />
            </svg>
        </div>

        <div class="pod-content">
            <!-- Account badge (click to switch / re-login) -->
            <button id="account-badge" class="badge-btn" title="Click to sign in with QR code">
                <span id="account-dot" class="status-dot dot-gray"></span>
                <span id="account-name">Sign In</span>
            </button>

            <span class="divider"></span>

            <!-- Room selection & switch -->
            <div class="room-selector-group">
                <div id="room-input-box" class="room-pill" data-tauri-drag-region="false">
                    <span id="room-dot" class="status-dot dot-gray"></span>
                    <input id="room-input" type="text" placeholder="Room ID or URL..." spellcheck="false" autocomplete="off" />
                    <button id="room-dropdown-btn" class="icon-btn" title="Show room list">▾</button>
                </div>
                <button id="room-switch-btn" class="action-btn">Connect</button>

                <!-- Quick dropdown panel (hidden by default) -->
                <div id="room-dropdown-menu" class="dropdown-menu hidden" data-tauri-drag-region="false">
                    <div class="dropdown-section">
                        <div class="section-title">🏠 My Room</div>
                        <div id="my-room-item" class="menu-item empty-hint">No room found</div>
                    </div>
                    <div class="dropdown-section">
                        <div class="section-title">🔴 Following Live</div>
                        <div id="following-rooms-list" class="menu-items-list">
                            <div class="menu-item empty-hint">No live channels</div>
                        </div>
                    </div>
                    <div class="dropdown-section">
                        <div class="section-title">🕒 Recent Rooms</div>
                        <div id="history-rooms-list" class="menu-items-list">
                            <div class="menu-item empty-hint">No history</div>
                        </div>
                    </div>
                </div>
            </div>

            <span class="divider"></span>

            <!-- Theme selector -->
            <div class="theme-group">
                <select id="theme-select" class="dropdown-select" title="Select OBS overlay theme">
                    <option value="default">default</option>
                    <option value="sc-ticker">sc-ticker</option>
                </select>
            </div>

            <!-- Copy OBS URL button -->
            <button id="copy-obs-btn" class="pill-btn" title="Copy OBS Overlay URL">
                📋 OBS (:3838)
            </button>

            <!-- More actions menu button & popover -->
            <div class="more-menu-group">
                <button id="more-btn" class="more-btn" title="More actions" aria-haspopup="menu" aria-expanded="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="5" cy="12" r="2" />
                        <circle cx="12" cy="12" r="2" />
                        <circle cx="19" cy="12" r="2" />
                    </svg>
                </button>

                <div id="more-dropdown-menu" class="more-dropdown-menu hidden" role="menu" data-tauri-drag-region="false">
                    <button id="more-open-obs-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">🌐 <span id="more-open-obs-label">Open OBS Overlay (:3838)</span></span>
                    </button>
                    <button id="more-copy-obs-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">📋 Copy OBS Overlay URL</span>
                    </button>
                    <button id="more-open-list-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">🖥️ <span id="more-open-list-label">Open Danmaku Monitor (:3838/list)</span></span>
                    </button>
                    <button id="more-copy-list-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">📋 Copy Danmaku Monitor URL</span>
                    </button>
                    <div class="menu-separator"></div>
                    <button id="more-pin-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">📌 Always on Top</span>
                        <span id="more-pin-check" class="menu-check">✓</span>
                    </button>
                    <div class="menu-separator"></div>
                    <button id="more-open-config-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">📄 Open Config File</span>
                    </button>
                    <button id="more-open-rec-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">📼 Open Recordings Folder</span>
                    </button>
                    <button id="more-open-log-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">📝 Open Logs Folder</span>
                    </button>
                    <div class="menu-separator"></div>
                    <button id="more-relogin-btn" class="more-menu-item" role="menuitem">
                        <span class="menu-item-label">🔄 Re-login</span>
                    </button>
                    <button id="more-logout-btn" class="more-menu-item danger" role="menuitem">
                        <span class="menu-item-label">🚪 Sign Out</span>
                    </button>
                </div>
            </div>

            <!-- Window controls (minimize / quit) -->
            <div class="win-controls">
                <button id="min-btn" class="win-btn" title="Minimize to tray">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12" /></svg>
                </button>
                <button id="close-btn" class="win-btn win-close" title="Quit Dambo">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" /></svg>
                </button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
